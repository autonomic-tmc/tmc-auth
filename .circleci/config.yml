version: 2.1

executors:
  java-image:
    working_directory: /root/repo
    environment:
      JAVA_TOOL_OPTIONS: -Xmx1024m
    docker:
      - image: ${JFROG_DOCKER_HOST}/tmc-private-images/java
        auth:
          username: ${JFROG_USERNAME}
          password: ${JFROG_TOKEN}

  snapshot-publisher-image:
    working_directory: /root/repo
    environment:
      JAVA_TOOL_OPTIONS: -Xmx1024m
    docker:
      - image: ${JFROG_DOCKER_HOST}/tmc-private-images/java
        auth:
          username: ${JFROG_USERNAME}
          password: ${JFROG_TOKEN}

  gitleaks-image:
    working_directory: /root/repo
    docker:
      - image: ${JFROG_DOCKER_HOST}/tmc-private-images/gitleaks
        auth:
          username: ${JFROG_USERNAME}
          password: ${JFROG_TOKEN}

commands:
  checkout_https:
    steps:
      - run:
          name: Checkout via HTTPS
          command: |
            git clone https://${GITHUB_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git .

jobs:
  scan_secrets:
    executor: gitleaks-image
    steps:
      - checkout_https
      - persist_to_workspace:
          root: /root
          paths:
            - repo
      - run: gitleaks

  build:
    executor: java-image
    steps:
      - checkout_https

      - run: mvn clean
      - run:
          command: |
            cd ~/repo/examples/gradle-example
            ./gradlew clean

      - restore_cache:
          keys:
            - v3-dependencies-{{ checksum "pom.xml" }}-{{ checksum "examples/maven-example/pom.xml" }}-{{ checksum "examples/gradle-example/build.gradle" }}

      - run:
          name: maven install
          command: |
            cd ~/repo
            mvn install dependency:go-offline -DprocessAllModules -DskipTests

      - run:
          name: gradle build
          command: |
            cd ~/repo/examples/gradle-example
            ./gradlew build -x test -Ptmc-auth.version=LOCAL-SNAPSHOT

      - persist_to_workspace:
          root: /root
          paths:
            - repo
            - .m2
            - .gradle

      - save_cache:
          paths:
            - ~/.m2
            - ~/.gradle
          key: v3-dependencies-{{ checksum "pom.xml" }}-{{ checksum "examples/maven-example/pom.xml" }}-{{ checksum "examples/gradle-example/build.gradle" }}

  test:
    executor: java-image
    steps:
      - attach_workspace:
          at: /root

      - run:
          name: Run tmc-auth test suite
          command: mvn verify -Pintegration-tests

      - run:
          name: Save test results
          command: |
            mkdir -p ~/test-output
            cp -fr target/surefire-reports ~/test-output
            cp -fr target/site/jacoco ~/test-output
          when: always

      - run:
          name: Run maven example test
          command: |
            cd ~/repo/examples/maven-example
            export M2_HOME=$MAVEN_CONFIG
            export MAVEN_CONFIG=
            mvn test -Dtmc-auth.version=LOCAL-SNAPSHOT

      - run:
          name: Run gradle example test
          command: |
            cd ~/repo/examples/gradle-example
            ./gradlew test -Ptmc-auth.version=LOCAL-SNAPSHOT

      - store_test_results:
          path: ~/test-output
      - store_artifacts:
          path: ~/test-output

      - persist_to_workspace:
          root: /root
          paths:
            - repo

  examples:
    executor: java-image
    steps:
      - attach_workspace:
          at: /root
      - run:
          name: Run Maven Example
          command: |
            cd ~/repo/examples/maven-example
            export M2_HOME=$MAVEN_CONFIG
            export MAVEN_CONFIG=
            ./run.sh LOCAL-SNAPSHOT
      - run:
          name: Run Gradle Example
          command: |
            cd ~/repo/examples/gradle-example
            ./run.sh LOCAL-SNAPSHOT

  publish-public:
    executor: java-image
    working_directory: /root/repo/
    steps:
      - checkout_https
      - restore_cache:
          keys:
            - v3-dependencies-{{ checksum "pom.xml" }}-{{ checksum "examples/maven-example/pom.xml" }}-{{ checksum "examples/gradle-example/build.gradle" }}
      - run:
          name: Set new version
          command: mvn versions:set -DnewVersion=${CIRCLE_TAG}
      - run:
          name: Publish to cloudsmith
          command: |
            mvn deploy \
              -Pcloudsmith-autonomic-au-tmc-oss \
              -DaltDeploymentRepository="cloudsmith-autonomic-au-tmc-oss::https://maven.cloudsmith.io/autonomic/au-tmc-oss" \
              -DskipTests

  publish-public-jfrog:
    executor: snapshot-publisher-image
    working_directory: /root/repo
    steps:
      - attach_workspace:
          at: /root
      - run: |
          mvn versions:set -DnewVersion=${CIRCLE_TAG}
      - run:
          name: Publish tmc-auth to JFrog
          command: |
            mvn deploy \
              -Pford-supplier-jfrog-artifactory-tmc-oss \
              -DaltDeploymentRepository="ford-supplier-jfrog-artifactory-tmc-oss::default::${JFROG_URL}/${JFROG_REPO_TMC_OSS}" \
              -DskipTests

  push-to-public:
    executor: snapshot-publisher-image
    steps:
      - checkout_https
      - run:
          name: Push to public repo
          command: /root/publish.sh push_public tmc-auth ${CIRCLE_BRANCH} ${CIRCLE_BRANCH}

workflows:
  version: 2.1
  build_and_test:
    jobs:
      - scan_secrets:
          context:
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context
      - build:
          requires:
            - scan_secrets
          context:
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context
      - test:
          requires:
            - build
          context:
            - tmc-oss-context
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context
      - examples:
          requires:
            - build
          context:
            - tmc-oss-context
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context

  release:
    jobs:
      - scan_secrets:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
          context:
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context

      - build:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
          requires:
            - scan_secrets
          context:
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context

      - publish-public:
          context:
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/

      - publish-public-jfrog:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
          requires:
            - build
          context:
            - tmc-cloudsmith-context
            - ford-supplier-jfrog-context
